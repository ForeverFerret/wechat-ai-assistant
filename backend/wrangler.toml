name = "wechat-ai-assistant-backend"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true


[vars]
WECHAT_APP_ID = "wx16e8c7a101ca20da"
WECHAT_TEMPLATE_ID = "8OuR21EjgXZeQY12NrU44-nw1MEV7_6dA-4xoMokuWk"
TIMEZONE = "Asia/Shanghai"

# 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "wechat_ai_db"
database_id = "6f561c78-cd7a-4de2-aaf5-f07a072c7299"


# 定时触发器 (每分钟检查一次到期任务)
[triggers]
crons = ["* * * * *"]
